[workspace]

[package]
name = "mcp-pharmacy"
version = "1.0.1"
edition = "2024"
rust-version = "1.94.1"
description = "Global drug reference and regulatory intelligence MCP server — OpenFDA, DailyMed, RxNorm, PubChem, Health Canada, EMA, ClinicalTrials.gov"
license = "Apache-2.0"
repository = "https://github.com/zavora-ai/mcp-pharmacy"
keywords = ["mcp", "pharmacy", "drug-reference", "openfda", "regulatory"]
categories = ["science", "api-bindings"]

[features]
default = ["openfda", "dailymed", "rxnorm", "pubchem", "health-canada", "clinicaltrials", "ema"]
openfda = []
dailymed = []
rxnorm = []
pubchem = []
health-canada = []
clinicaltrials = []
ema = []
all-backends = ["openfda", "dailymed", "rxnorm", "pubchem", "health-canada", "clinicaltrials", "ema"]

[dependencies]
adk-mcp-sdk = { version = "0.2.0", git = "https://github.com/zavora-ai/adk-mcp-sdk.git", rev = "4dac4301441a8a51a042fd66cc1798f0ec3e3f55" }
rmcp = { version = "3.1.2", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1"
zip = "2"
